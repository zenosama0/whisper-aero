name: Build Native Apps (Android APK & Windows EXE)

on:
  workflow_dispatch:
  release:
    types: [published]
  push:
    branches: [main]
    paths:
      - 'native/**'
      - 'icon-512.png'
      - 'version.json'
      - '.github/workflows/build-native.yml'

permissions:
  contents: read

jobs:
  android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Generate Android launcher icons from icon-512.png
        run: |
          python3 -c "import PIL" 2>/dev/null || pip3 install --quiet pillow
          python3 - << 'EOF'
          import os
          from PIL import Image, ImageDraw

          src = Image.open('icon-512.png').convert('RGBA')
          sizes = {
              'mipmap-mdpi': 48,
              'mipmap-hdpi': 72,
              'mipmap-xhdpi': 96,
              'mipmap-xxhdpi': 144,
              'mipmap-xxxhdpi': 192,
          }
          res_root = 'native/android/app/src/main/res'
          for folder, px in sizes.items():
              out_dir = os.path.join(res_root, folder)
              os.makedirs(out_dir, exist_ok=True)
              resized = src.resize((px, px), Image.Resampling.LANCZOS)
              resized.save(os.path.join(out_dir, 'ic_launcher.png'))

              mask = Image.new('L', (px, px), 0)
              ImageDraw.Draw(mask).ellipse((0, 0, px - 1, px - 1), fill=255)
              rounded = Image.new('RGBA', (px, px), (0, 0, 0, 0))
              rounded.paste(resized, (0, 0), mask)
              rounded.save(os.path.join(out_dir, 'ic_launcher_round.png'))
          EOF

      - name: Build Android Debug APK
        working-directory: native/android
        env:
          VERSION_CODE: ${{ github.run_number }}
        run: |
          VERSION_NAME=$(python3 -c "import json; print(json.load(open('../../version.json'))['version'])")
          export VERSION_NAME
          export VERSION_CODE=$((20 + VERSION_CODE))
          gradle assembleDebug --no-daemon

      - name: Stage APK artifact
        run: |
          mkdir -p dist-artifacts
          cp native/android/app/build/outputs/apk/debug/app-debug.apk dist-artifacts/Whisper-Android.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Whisper-Android-APK
          path: dist-artifacts/Whisper-Android.apk

  windows:
    name: Build Windows EXE
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Generate Windows app.ico from icon-512.png
        shell: pwsh
        run: |
          python -c "import PIL" 2>$null
          if ($LASTEXITCODE -ne 0) { python -m pip install --quiet pillow }
          python -c "from PIL import Image; img = Image.open('icon-512.png').convert('RGBA'); img.save('native/windows/app.ico', format='ICO', sizes=[(16,16),(24,24),(32,32),(48,48),(64,64),(128,128),(256,256)])"

      - name: Publish standalone Windows EXE
        shell: pwsh
        run: |
          $version = (Get-Content version.json | ConvertFrom-Json).version
          dotnet publish native/windows/WhisperAero.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:Version=$version `
            -o dist-windows

      - uses: actions/upload-artifact@v4
        with:
          name: Whisper-Windows-EXE
          path: dist-windows/Whisper.exe

  release:
    name: Publish GitHub Release
    needs: [android, windows]
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            release-assets/Whisper-Android.apk
            release-assets/Whisper.exe
