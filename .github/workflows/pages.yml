name: Deploy Whisper to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/configure-pages@v5
      - name: Prepare static site and public Supabase config
        env:
          SUPABASE_URL: ${{ secrets.WHISPER_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.WHISPER_SUPABASE_ANON_KEY }}
        run: |
          mkdir _site
          cp -R index.html styles.css app.js app-config.js icon.svg manifest.webmanifest sw.js robots.txt sitemap.xml _site/
          node -e 'const fs=require("node:fs"); fs.writeFileSync("_site/app-config.js", `window.WHISPER_CONFIG = ${JSON.stringify({supabaseUrl:process.env.SUPABASE_URL||"",supabaseAnonKey:process.env.SUPABASE_ANON_KEY||""})};\n`);'
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
